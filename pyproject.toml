[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-skeleton"
version = "0.1.0"
description = "Minimal Python project scaffold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
project-skeleton = "project_skeleton.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
